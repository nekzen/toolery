id: easy-17-coding-find-failing-test
title: "Identify which pytest test failed"
tier: very_hard  # re-tiering kwantylowy 2026-06-11 (kwoty 40/45/34/24, empiryczna trudnosc): oryg easy, pass-rate 26.7% (3 modele)
category: coding
domain: dev_ops
description: |
  Stretched easy. Model runs pytest, parses mixed PASS/FAIL output, and
  identifies the specific test that failed (not just count). Requires
  understanding pytest's "FAILED tests/X::Y" format, not just the summary.
tags: [coding, parse_output, single_turn, stretched_easy]
ranking_dimensions: [overall, coding]
prompt: "Run the test suite. If anything failed, tell me which test."
tools: [bash_exec]
budget:
  # The prompt does not say how the suite is run: one look around (or one
  # wrong guess), then pytest.
  max_tool_calls: 3
  max_turns: 3
  timeout_seconds: 40
tool_responses:
  bash_exec:
    - match: { command_regex: 'pytest' }
      returns:
        stdout: "tests/test_calc.py ......F                                       [100%]\n\n=========================== FAILURES ===========================\n____________________ test_divide_by_zero ____________________\n\nE   ZeroDivisionError: integer division or modulo by zero\n\n=========================== short test summary info ===========================\nFAILED tests/test_calc.py::test_divide_by_zero - ZeroDivisionError: integer division or modulo by zero\n7 passed, 1 failed in 0.61s\n"
        stderr: ""
        exit_code: 1
        duration_ms: 610
    # Every other command used to "succeed" with empty output: `ls` showed an
    # empty disk and `npm test` "passed" silently. The project is now visible
    # and other runners fail the way they really would.
    - match: { command_regex: '\bcat\b[^;&|]*pyproject' }
      returns: { stdout: "[project]\nname = \"calc\"\nversion = \"0.1.0\"\n\n[tool.pytest.ini_options]\ntestpaths = [\"tests\"]\n", stderr: "", exit_code: 0, duration_ms: 2 }
    - match: { command_regex: '\bcat\b[^;&|]*README' }
      returns: { stdout: "# calc\n\nRun the tests with `pytest`.\n", stderr: "", exit_code: 0, duration_ms: 2 }
    - match: { command_regex: '^\s*(?:ls|find|tree|git\s+ls-files)\b' }
      returns: { stdout: "README.md\npyproject.toml\nsrc/calc.py\ntests/test_calc.py\n", stderr: "", exit_code: 0, duration_ms: 3 }
    - match: { command_regex: '^\s*pwd\b' }
      returns: { stdout: "/home/user/calc\n", stderr: "", exit_code: 0, duration_ms: 1 }
    - match: { command_regex: '^\s*npm\b' }
      returns: { stdout: "", stderr: "npm ERR! enoent Could not read package.json: no such file or directory\n", exit_code: 254, duration_ms: 90 }
    - match: { command_regex: '^\s*make\b' }
      returns: { stdout: "", stderr: "make: *** No rule to make target 'test'.  Stop.\n", exit_code: 2, duration_ms: 4 }
    - match: any
      returns: { stdout: "", stderr: "command not available in this sandbox", exit_code: 127, duration_ms: 1 }
scoring:
  required:
    - check: tool_called
      tool: bash_exec
    - check: response_satisfies
      all_of: ["test_divide_by_zero"]
      any_of:
        - ["test_calc", "tests/test_calc.py"]
  forbidden: []
  partial:
    - check: command_regex_match
      pattern: 'pytest'
    - check: response_satisfies
      any_of:
        - ["fail", "FAIL", "failed"]
    - check: response_satisfies
      any_of:
        - ["ZeroDivisionError", "zero division", "divide", "division by zero"]
  weights:
    pass: 1.0
    partial: 0.5
    fail: 0.0
