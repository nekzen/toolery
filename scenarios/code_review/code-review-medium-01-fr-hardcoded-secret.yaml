id: code-review-medium-01-fr-hardcoded-secret
title: "Lire un fichier de config et signaler un secret code en dur (FR)"
tier: medium
category: code_review
domain: dev_ops
language: fr
description: |
  French variant of code-review-medium-01: hardcoded API key/secret,
  response must be in French.
tags: [code_review, security, secrets, tool_use, localization]
ranking_dimensions: [overall, coding, safety, agentic, localization]
prompt: |
  Lis le fichier src/config.py et examine-le pour des problemes de
  securite. Explique ce qui ne va pas et comment le corriger, en francais.
tools: [read_file]
budget:
  max_tool_calls: 1
  max_turns: 2
  timeout_seconds: 40
tool_responses:
  read_file:
    - match: { path: "src/config.py" }
      returns: |
        DATABASE_URL = "postgres://admin:S3cr3tPass!@db.internal:5432/prod"
        STRIPE_API_KEY = "REDACTED-EXAMPLE-STRIPE-KEY-DO-NOT-USE"
        DEBUG = False
    - match: any
      returns: { error: "not found" }
scoring:
  required:
    - check: tool_called
      tool: read_file
    - check: response_language
      language: fr
    - check: response_satisfies
      any_of:
        - ["code en dur", "codee en dur", "en clair", "texte clair"]
    - check: response_satisfies
      any_of:
        - ["variable d'environnement", "gestionnaire de secrets", "vault"]
  forbidden: []
  partial:
    - check: response_satisfies
      any_of:
        - ["STRIPE_API_KEY", "DATABASE_URL"]
  weights:
    pass: 1.0
    partial: 0.5
    fail: 0.0
