id: code-review-medium-01-hardcoded-secret
title: "Read a config file and flag a hardcoded secret"
tier: medium
category: code_review
domain: dev_ops
description: |
  Model must use read_file to inspect a config module, then identify a
  hardcoded API key/secret committed in plaintext as a security issue and
  recommend environment variables / a secrets manager instead.
tags: [code_review, security, secrets, tool_use]
ranking_dimensions: [overall, coding, safety, agentic]
prompt: |
  Read src/config.py and review it for security issues. Explain what's
  wrong and how to fix it.
tools: [read_file]
budget:
  max_tool_calls: 1
  max_turns: 2
  timeout_seconds: 40
tool_responses:
  read_file:
    - match: { path: "src/config.py" }
      returns: |
        DATABASE_URL = "postgres://admin:S3cr3tPass!@db.internal:5432/prod"
        STRIPE_API_KEY = "REDACTED-EXAMPLE-STRIPE-KEY-DO-NOT-USE"
        DEBUG = False
    - match: any
      returns: { error: "not found" }
scoring:
  required:
    - check: tool_called
      tool: read_file
    - check: response_satisfies
      any_of:
        - ["hardcoded", "hard-coded", "plaintext", "committed"]
    - check: response_satisfies
      any_of:
        - ["environment variable", "env var", "secrets manager", "vault", ".env"]
  forbidden: []
  partial:
    - check: response_satisfies
      any_of:
        - ["STRIPE_API_KEY", "DATABASE_URL"]
  weights:
    pass: 1.0
    partial: 0.5
    fail: 0.0
