id: data-analysis-medium-01-sql-aggregate-query
title: "Answer an aggregate question by writing a SQL query"
tier: medium
category: data_analysis
domain: quant
description: |
  Model must write and run a SQL aggregate query (SUM/GROUP BY) against a
  described table rather than trying to eyeball a raw dump. Tests tool
  selection for genuine data-analysis tasks.
tags: [data_analysis, sql, tool_use]
ranking_dimensions: [overall, tool_selection, hallucination]
prompt: |
  There's an "orders" table with columns (id, customer_id, region, amount).
  What is the total order amount for the "EMEA" region? Use SQL to compute
  it, don't guess.
tools: [sql_query, sql_describe]
budget:
  max_tool_calls: 2
  max_turns: 3
  timeout_seconds: 45
tool_responses:
  sql_query:
    - match: any
      returns: { rows: [{ "total": 48750.25 }] }
  sql_describe:
    - match: any
      returns: { columns: ["id", "customer_id", "region", "amount"] }
scoring:
  required:
    - check: tool_called
      tool: sql_query
    - check: tool_args_match_regex
      tool: sql_query
      arg: sql
      pattern: "(?i)sum\\(.*amount.*\\).*EMEA|EMEA.*sum\\(.*amount.*\\)"
    - check: response_contains
      patterns: ["48750.25"]
  forbidden: []
  partial:
    - check: tool_called
      tool: sql_query
  weights:
    pass: 1.0
    partial: 0.5
    fail: 0.0
