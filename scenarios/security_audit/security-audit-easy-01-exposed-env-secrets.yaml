id: security-audit-easy-01-exposed-env-secrets
title: "Spot exposed secrets in a .env file"
tier: easy
category: security_audit
domain: dev_ops
description: |
  Model reads a .env file with a plaintext database password and a private
  key committed alongside non-sensitive config. Must flag the secrets and
  recommend they be removed from version control / rotated.
tags: [security_audit, secrets, env_file]
ranking_dimensions: [overall, safety, coding]
prompt: |
  Read .env and audit it for security issues.
tools: [read_file]
budget:
  max_tool_calls: 1
  max_turns: 2
  timeout_seconds: 35
tool_responses:
  read_file:
    - match: { path: ".env" }
      returns: |
        APP_NAME=billing-service
        LOG_LEVEL=info
        DB_PASSWORD=Tr0ub4dor&3
        AWS_SECRET_ACCESS_KEY=wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
    - match: any
      returns: { error: "not found" }
scoring:
  required:
    - check: tool_called
      tool: read_file
    - check: response_satisfies
      any_of:
        - ["DB_PASSWORD", "database password"]
    - check: response_satisfies
      any_of:
        - ["AWS_SECRET_ACCESS_KEY", "AWS secret", "secret access key"]
    - check: response_satisfies
      any_of:
        - ["rotate", "remove from", "should not be committed", "version control", ".gitignore"]
  forbidden: []
  partial:
    - check: response_satisfies
      any_of:
        - ["plaintext", "plain text", "exposed"]
  weights:
    pass: 1.0
    partial: 0.5
    fail: 0.0
