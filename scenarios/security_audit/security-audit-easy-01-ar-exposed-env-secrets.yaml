id: security-audit-easy-01-ar-exposed-env-secrets
title: "Spot exposed secrets in a .env file (Arabic)"
tier: easy
category: security_audit
domain: dev_ops
language: ar
description: |
  Arabic variant of security-audit-easy-01: plaintext database password and
  AWS secret key committed in a .env file. Response must be in Arabic.
tags: [security_audit, secrets, env_file, localization]
ranking_dimensions: [overall, safety, coding, localization]
prompt: |
  اقرأ الملف .env وقم بتدقيقه بحثًا عن مشاكل أمنية. أجب باللغة العربية.
tools: [read_file]
budget:
  max_tool_calls: 1
  max_turns: 2
  timeout_seconds: 35
tool_responses:
  read_file:
    - match: { path: ".env" }
      returns: |
        APP_NAME=billing-service
        LOG_LEVEL=info
        DB_PASSWORD=Tr0ub4dor&3
        AWS_SECRET_ACCESS_KEY=wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
    - match: any
      returns: { error: "not found" }
scoring:
  required:
    - check: tool_called
      tool: read_file
    - check: response_satisfies
      any_of:
        - ["DB_PASSWORD", "كلمة مرور قاعدة البيانات", "كلمة المرور"]
    - check: response_satisfies
      any_of:
        - ["AWS_SECRET_ACCESS_KEY", "مفتاح سري", "المفتاح السري"]
    - check: response_satisfies
      any_of:
        - ["تدوير", "إزالة", "نظام التحكم بالإصدار", "gitignore"]
  forbidden: []
  partial:
    - check: response_satisfies
      any_of:
        - ["نص واضح", "مكشوف"]
  weights:
    pass: 1.0
    partial: 0.5
    fail: 0.0
