# The talk in the lounge. Stroud stops pretending, makes his offer and asks
# where the key is. The conversation ends on him waiting for an answer.
turns:
  - user: |
      You look at Ilse, Dev and Odile, then back at Stroud. "We talk here, in the lounge, where they can see us. Not upstairs." You walk to the armchairs by the fire and sit.
    narrator: |
      Stroud inclines his head, as if you had made a reasonable counter-offer in a negotiation. He takes off his sodden coat and drapes it over the back of a chair to drip, and sits down across the hearth from you in his shirtsleeves, holding his hands out to the coals. Without the coat he looks older and thinner, and his hands are shaking slightly with cold.

      Dev retreats to the far end of the lounge and sits on the arm of the couch with his radio, close enough to come in three strides. Ilse stays behind the desk. Odile does not move from her armchair on the other side of the fire, nor does she pretend to be doing anything but listening. Stroud glances at her and seems to decide she can't be helped.

      "Well," he says. "Here we are." He rubs his hands together. "I'll start with something true, as a gesture of good faith. I'm not a lawyer. I was, once. Now I solve problems for people who can afford me. My current client is a man named Lyle Brandt, who owns Kessler Valley Cold Storage, or did, until it burned down." He smiles thinly. "Your turn."
  - user: |
      You fold your arms. "You already know my turn. I work for the insurer. The fire wasn't an accident, and Brandt wants a payout he isn't entitled to. Where is Agnes Pell, Gabriel?"
    narrator: |
      "Ah. Agnes." Stroud nods slowly, looking into the fire. "Agnes kept the books for Lyle for nineteen years, and somewhere around year eighteen she began keeping a second set, for herself. Insurance, I suppose you'd call it, which is a joke in the circumstances." He glances at the wet tote by the door. "I don't know where Agnes is. That's the truth. Her car is down there under the trees with the keys in it and nobody inside, and her bag was in the back seat. I wanted to see if what I'm looking for was in it." He spreads his empty hands. "It wasn't. Which tells me she gave it to someone before she disappeared."

      His grey eyes come back to you, steady and tired. "There was a message on a burner phone in her glovebox. One number, called four times on the twenty-ninth. I'd be very surprised if it wasn't yours." He lets that sit. Behind the desk, Ilse has put down her paperback.
  - user: |
      You don't let anything show on your face. "If you didn't hurt her, you've got nothing to worry about from what she gave me. If you did, nothing you offer is going to matter."
    narrator: |
      "I didn't hurt her." Stroud says it quietly and without emphasis, and for the first time since he walked in out of the snow it is impossible to tell whether he is lying. "I'm not that kind of problem-solver. I don't need to be. Most people, Tess, have a number." He leans forward, elbows on his knees. "Mine for you is a hundred and fifty thousand. Cash, or anywhere you like. You give me what Agnes gave you, you write a report that says the wiring was old, and you go back to the valley and buy a car that doesn't end up in ditches."

      In the far corner Dev shifts on the arm of the couch, and the springs creak. Odile writes something down.

      "Or," Stroud goes on, mildly, "the plough comes on Thursday, and the police come with it, and I tell them a story about an insurance investigator who was in contact with a missing woman the day she vanished, and who has been very secretive about something ever since. I'm a good storyteller. You'll have noticed." He sits back. "I don't want that. I'd much rather the money."
  - user: |
      You let the silence stretch. "And if I say no?"
    narrator: |
      Stroud looks around the lounge: the antlers over the hearth, the old skis by the door, the long pine counter where Ilse sits, the dark stairs, the corridor beyond the dining room. "Then I keep looking," he says. "It's a big old building, but it's not that big, and none of us is going anywhere. I've already been through your car and your room and the office, as you've no doubt worked out. That leaves fewer places every day." He smiles at Ilse over his shoulder. "Lovely hotel, by the way. Full of nooks."

      Ilse looks back at him with no expression whatsoever.

      Stroud turns back to you. "But I don't think it'll come to that. You're a sensible woman. You put a chair under your door handle tonight. I heard it scrape." He picks a flake of snow off his trouser leg and flicks it into the fire, where it hisses. "Think about it. Sleep on it, if anybody here can sleep. I'll ask you again in the morning."
  - user: |
      You stand up. "I don't need to sleep on it." You turn to Dev. "Can you stay down here with Ilse and the doctor? I'm going up."
    narrator: |
      Dev is on his feet at once. "Not going anywhere," he says, and for once it doesn't sound like a joke. He drags the couch a little closer to the foot of the stairs and sits down on it with his radio across his knees, facing the room. Odile gathers her dressing gown around her and does not move from her chair either.

      Stroud remains seated by the fire, looking up at you. He doesn't try to stop you. "You haven't heard the whole offer," he says. "There's a second part, and it concerns Agnes, and I think you'd want to hear it before you decide anything." He waits until you have taken a step toward the stairs. "I didn't hurt her. But I know who she was afraid of, and it wasn't me. If you want to find her alive, you'll need someone who knows Lyle Brandt's people. That's me."

      The fire pops. On the stairs above you, a board creaks: Pia Lindqvist, in a coat over her nightgown, has been sitting in the dark on the landing, and is now very obviously trying not to be seen.
  - user: |
      You stop at the foot of the stairs and turn back to face Stroud. "Then tell me what you know about Agnes. Now. Here, in front of everyone."
    narrator: |
      Stroud considers you for a long moment. Then he nods, as though conceding a point, and stands up stiffly from the armchair, his shirt still damp, his shadow long across the floorboards in the firelight.

      "Lyle has a brother-in-law who does his collecting," he says. "Not a lawyer, not a fixer. A man with a truck and no sense of humour. Agnes called me on the twenty-eighth, not you, me, because she thought I could make him stop. I told her to run. I think she did, and I think she ran up here, toward you." He pauses. "And I think the brother-in-law knows it, because his truck passed me on the way up last night, coming down from the pass with its lights off, an hour before I found her car."

      He takes one step toward you, and stops, his hands open at his sides. In the quiet, everyone in the lobby is listening: Dev on the couch, Ilse behind the desk, Odile by the fire, Pia on the dark landing. "So here is the second part of my offer, Tess. Tell me where it is, and I will help you find her before he does. Where did you put it?"

      He waits for your answer.
