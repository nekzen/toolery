      Stroud looks down at the tote on his shoulder as though noticing it for the first time. Water drips from the hem of his coat onto Bernard's mat. "This? I found it in the snow by the road. Someone must have dropped it. I thought I'd bring it in and hand it to the authorities when they arrive. Civic duty." He shrugs it off his shoulder and holds it out toward Ilse, not toward you. "Lost property. You'll have a box for that, I imagine."

      Ilse doesn't move to take it. Dev doesn't move from the window. Odile writes.

      Stroud lowers the bag slowly and sets it on the floor by his feet. The red scarf trails across the wet boards. He looks at each of you in turn, last of all at you, and something in his face settles, the way a man settles who has decided to stop pretending about one thing in order to keep pretending about another. "It's very late," he says quietly. "Tess. Could we talk? Just the two of us. I think it would save everybody a great deal of trouble."
