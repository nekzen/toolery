    narrator: |
      Nobody argues. Dev pulls on his boots and takes up a position by the front window with his radio, which gives only static at this hour. Ilse puts the kettle on in the office and comes back with four mugs of tea nobody drinks. Odile writes in her notebook: the time, and then everything everyone says.

      The fire burns down. At 3:40 a flashlight beam appears far down the white slope, tiny and wavering, climbing. It takes him almost half an hour to come back up through the snow. When the front door opens he is plastered with snow to the chest, his city shoes gone shapeless, his face grey with cold. He has a bag over his shoulder that was not his when he left: a woman's canvas tote, sodden, with a red scarf knotted to the strap.

      He stops dead on the mat when he sees the four of you waiting in the firelight. For a moment his face shows nothing at all. Then the pleasant smile comes back, slowly, like a lamp being turned up. "Insomnia," he says. "It's going round."
