      The lobby is lit only by the fire and one brass lamp at the end of the desk. Ilse is behind the counter, wide awake, her paperback face down beside her and her parka already half on. Dev is asleep on the couch in the lounge under a pile of blankets, snoring gently, one arm hanging to the floor. And in the armchair by the fire, in a dressing gown and boots, her notebook on her knees, sits Odile.

      "He went out ninety seconds ago," Ilse says, low. "Didn't see me, or pretended not to. I was about to wake Dev." She looks at the black window. "That's the way to the slide. In the dark. He's either a fool or he knows exactly where he's going."

      Odile closes her notebook. "He knows," she says calmly. "He went the same way at eleven o'clock last night, Ms. Morrow, after you had gone up to bed. I saw him from my window. He did not come here then. He had a car below the slide, and he went down to it, and came back up, and then down again." She folds her hands on the notebook. "I am old and I don't sleep, and I write down everything. It is a vice."
  - user: |
      You stare at Odile. "Last night? He told everyone he arrived this morning, that he climbed over the slide at dawn." You keep your voice down. "Doctor, what exactly did you see?"
