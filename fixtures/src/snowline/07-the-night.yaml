      Odile opens her notebook and turns back a few pages, holding it to the firelight. Her handwriting is tiny and very neat. "Twenty-three ten. A car stops on the road below the fourth bend, lights off. A man gets out, tall, dark coat. He walks up and down the road with a torch, looking at the cars." She glances up. "Yours, and another one, under the trees at the viewpoint. He opens yours. He spends a long time at the other." She turns a page. "Twenty-three fifty-five. He goes back to his car. It does not leave. Then in the morning, the slide, and he comes knocking at our door like a lost lamb with wet shoes."

