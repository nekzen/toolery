# The night: someone tries the door of fourteen, Stroud goes out into the
# snow and comes back with Agnes Pell's bag. Odile has seen him before.
turns:
  - user: |
      You go up to room fourteen, lock the door, wedge the chair under the handle, and lie on the bed fully dressed with the light off, listening.
    narrator: |
      For a long time there is nothing but the building: the radiator clanking as it cools, the faint thud of the generator two floors down, the hum of the ice machine at the end of the corridor, a branch scraping somewhere against the eaves. Your watch tells you nothing, as usual. The travel clock on the bedside table says 1:12, then 1:40, then 2:05.

      At 2:17 the floorboards in the corridor creak, slowly, one after another, the way boards creak under someone who knows they creak and is trying to be quiet. The steps come toward the end of the corridor and stop outside your door.

      In the thin line of light under the door, a shadow stands still. Then the handle turns, very gently, as far as it will go against the lock. It holds there for a second, two seconds. The chair wedged under it shifts a millimetre on the floorboards with a tiny scrape. The handle eases back. The shadow stays where it is.
  - user: |
      You stay absolutely still on the bed and keep your breathing quiet. You wait.
    narrator: |
      The shadow under the door waits too. Ten seconds. Twenty. Somewhere downstairs a log collapses in the lobby fire with a soft crunch.

      Then the steps go away, back down the corridor, as slowly and carefully as they came. You hear them pass ten, eleven, twelve; they do not stop at any door. At the far end, the stairs creak once, twice, and then there is nothing.

      A minute later, from below your window, comes the muffled thump of the front door closing. When you look out, keeping to the side of the frame, a single figure is wading away from the porch through snow up to its thighs, a flashlight beam bobbing in front of it, heading not toward the parking lot but down toward the buried road, toward the slide and whatever lies beyond it. Tall. A long dark coat.
