# Dinner, then Dev's radio: a relayed message about the bookkeeper, Agnes
# Pell. Pia saw something on the second floor that morning.
turns:
  - user: |
      You lean on the counter, close to Ilse. "He was in the office during the blackout. I don't think he found anything. Keep your eyes open tonight." Then you go through to the dining room and sit at Dev's table.
    narrator: |
      Ilse gives a single nod and starts sorting the day's mail that never came, which is to say she starts watching the stairs.

      Dinner is lamb stew with dumplings, ladled out by Remy from a huge enamel pot onto plates that steam in the dim generator light. Dev has his radio standing on the table beside his plate like a guest. He eats with one hand and fiddles with the squelch knob with the other, and every so often the speaker breathes static at the room.

      "Dispatch goes quiet at eight," he says through a mouthful of dumpling. "If you've got something you want passed down the mountain, now's the time. They'll relay to the police in town, or a phone number, whatever. It's not private, mind. Anybody with a scanner in the valley can listen in." He nods toward the bar, where Stroud is sitting alone with his second whisky, half-turned toward the room. "And anybody in here with ears."
  - user: |
      You think for a moment, then lean in and speak quietly. "Can you ask dispatch to call a number in town and leave a message? Just say that Tess Morrow is at the Kessler Pass Lodge and is fine. Nothing else."
    narrator: |
      Dev writes the number you give him on the back of his hand with a ballpoint, then thumbs the radio. "Dispatch, Plough Seven." Static. He tries again, and on the third try a tired woman's voice answers, crackling and far away. He passes your message in a flat, bored county-roads voice, as if it were a road report: name, place, fine, nothing else. The woman reads it back and says she'll call it in when she gets a minute.

      Then she adds: "Plough Seven, while I've got you. Sheriff's asking anybody up on the pass to keep an eye out for a woman named Agnes Pell, fifty-eight, grey hair, drives a green Subaru. Reported missing by her sister yesterday. Car was last seen heading up toward Kessler on the twenty-ninth. Over."

      Dev glances at you, then back at the radio. "Copy that. Nobody here by that name. Plough Seven out." He sets the radio down. At the bar, Stroud has not moved, but his glass has stopped halfway to his mouth.
  - user: |
      You keep your face still and eat a spoonful of stew. After a moment, quietly: "Dev, did you see a green Subaru anywhere on the way up last night?"
    narrator: |
      Dev chews slowly, thinking. "There was a car at the scenic pullout at the fourth switchback, the one with the view. Nosed in under the trees, covered in snow already. I didn't think anything of it, people leave cars there for the trailhead in summer." He frowns. "Could've been green. Could've been anything, under a foot of snow in the dark." He wipes the number off the back of his hand with his thumb, leaving a blue smear. "That's below the slide, though. Nobody's getting to it before the blower."

      Across the room, Stroud sets his glass down, gets up, and stretches with a small groan, a man stiff from a long day. He wishes Bernard good night at the bar, nods politely to the Lindqvists, and goes up the stairs at an ordinary pace. You hear his footsteps cross the ceiling above the dining room and a door close.

      Pia Lindqvist is watching the stairs too. When the door upstairs closes, she picks up her wine glass, says something in Swedish to her husband that makes him sigh, and comes across the dining room to your table. "May I?" she says, and sits down before you can answer.
  - user: |
      You raise an eyebrow at her. "Apparently you may. What can I do for you, Pia?"
    narrator: |
      Pia leans in, her plait swinging forward over her shoulder. Close up, her curiosity has an edge of nerves to it. "I'm not just nosy," she says. "Well. I am nosy. But this morning, when I went up to get my book, I saw him." She tilts her head toward the ceiling. "The lawyer. In your corridor, at the end, by the ice machine. He had just come out of a room. Not his room, his is eleven, we're twelve, I know his door." She takes a sip of wine. "He saw me. He smiled and said the ice machine was broken, as if he'd gone up there for ice. In January. In a place where you can open the window and take snow."

      Anders has followed her across the room and stands behind her chair with the patient face of a man who knows he is now involved. "Pia," he says gently. "We don't know anything."

      "We know he lied about ice," Pia says. She looks at you. "Room fourteen is at the end of that corridor. That's yours, isn't it?"
  - user: |
      You set down your spoon. "It is. Thank you for telling me, Pia. Have you told anyone else?"
    narrator: |
      "Only Anders, and he told me I was making a story because I'm bored." Pia glances up at her husband, who spreads his hands in surrender. "I'm a crime novelist," she adds, as if that explains everything, and perhaps it does. "Second book. Not very successful. But I know what a man looks like when he comes out of a room he shouldn't have been in."

      Anders puts a hand on her shoulder. "We'll stay out of it," he says to you, in careful English. "But if you need witnesses for anything, later. We are here. We are not going anywhere." He smiles faintly. "As everybody keeps saying."

      At the next table, Dev has been listening without pretending not to. He turns his radio off, and the static dies, and in the sudden quiet the generator can be heard thudding steadily under the floor. Remy comes out of the kitchen with a tray of apple cake and stops short, feeling the silence, holding the tray in front of him like a shield. "Is... does anybody want cake?"
  - user: |
      You manage a smile for the boy. "I'd love some, Remy. Thank you." You take a slice and look around the table at Dev, Pia and Anders. "Let's all just be careful tonight. Lock your doors."
    narrator: |
      Remy sets the cake down and hovers, then says in a rush, to you and nobody, "The man in eleven asked me about you. At lunch. Where you were from, how long you'd booked for, whether you'd left anything at the desk." He goes red to the ears. "I said I didn't know anything, because I don't. I just do the dishes." He retreats to the kitchen before anyone can answer.

      Dev lets out a low whistle. Pia looks thrilled and appalled at once. Anders squeezes her shoulder. "Locked doors," he says. "Yes. Good night." He steers his wife toward the stairs, and she goes, looking back twice.

      Dev picks up his radio and his plate. "I'm sleeping in the lounge, by the fire. Bernard says the plough cab's too cold and I believe him." He hesitates. "If you hear anything in the night, yell. I sleep light." He goes, and you are left alone at the table with the last of the apple cake, the steady thud of the generator, and through the doors the soft yellow light of the lobby, where Ilse sits behind the desk with her glasses on her head, reading a paperback.
