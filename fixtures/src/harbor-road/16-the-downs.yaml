    narrator: |
      The girl looks at you suspiciously, as though checking whether she is being made fun of, and finds that she isn't. Some of the fury goes out of her face. "Four's missing," she says, low. "Four of forty. Da will skin me." Then, gathering herself, very much the shepherd: "Fernhill's down off the end of the bank, by the thorn. I can find it in the mist. I've done it before." Which, by the look Gethin gives you over her head, is a lie, but a brave one.

      She leads, with the crook over her shoulder like a pike, and Sully moves the flock along behind her, and you and Gethin bring up the rear. The bank runs out at a lone thorn tree, bent flat by the wind, that looms up out of the white like a crouching man. From there a narrow path goes down steeply, slippery with wet chalk, into a fold of the hills where the mist is thinner, and then, quite suddenly, you are under it. The world comes back grey and dim and dripping: a combe with a little stream at the bottom, a sheepfold of hurdles, and a stone cottage with a turf roof and a light in the window.

      The door bangs open and a man hops out on a crutch, one leg bound in splints, shouting the girl's name before he has even seen who is with her.
