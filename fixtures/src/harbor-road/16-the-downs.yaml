      I take the bowl with thanks. "Gethin's told me a little. What do you know about it, up here on the hill?"
    narrator: |
      Tom Ashby eats a spoonful, considering. "I'll tell you what everybody up here knows and nobody down there will say. It's not the brook. Brook's just water, it goes where it's pushed." He points his spoon at you. "Thirty years back, Old Crane, Abel's father, he cleared the willows off the bank on his side, to make a field. And when you clear willows off a clay bank, the next flood takes the bank. Brook came over onto his side and he was glad of it, because it took Hollis land too, the way it bent. Then twenty years back the Hollises dug the old leat out again, to run the mill, and the brook went the other way."

      His wife sets down a loaf with a thump. "Tom. You'll not get mixed in it."

      "I'm not mixed in it. I'm telling the lady." He leans forward. "So when they say the brook moved, what they mean is, it was moved. Both of them moved it, one after the other. That's why Thurlow can't settle it. He keeps asking where the brook ran. Nobody's asking who moved it." He sits back, pleased with himself. Gethin has stopped eating, and is looking at Tom with his mouth slightly open.
