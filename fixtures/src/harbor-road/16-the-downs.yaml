      I cup my hands around my mouth and call back as loud as I can, "Here! By the bank!" and keep calling each time he calls.
    narrator: |
      For a long time it is only that: his call, far off and muffled, and yours flung back into the white, and the bleating of sheep coming nearer and then further, and once the sharp double bark of Sully working. Your voice comes back to you strangely flat. Your hands are cold and wet. The light, what there is of it, does not change, so there is no telling whether ten minutes have passed or forty.

      Then the bleating swells into a confused, pattering din, and sheep begin to come past you out of the mist, close enough to touch, a dozen, two dozen, grey-backed and dripping, with Sully running low and silent at their flank, turning them, holding them against the bank like water against a wall. Behind them comes Gethin, and with him, stumbling and soaked to the knees, a small figure in a sack apron with a crook much too big for her: a girl of perhaps ten, her face white and furious and streaked with crying she would clearly rather die than admit to.

      "Found the shepherd," says Gethin, breathing hard. "Bel Ashby, from Fernhill. Her father's laid up with his leg, so she brought the flock up herself to the top grazing, and the mist came down." He puts a big hand on the girl's head; she shakes it off. "She'd have been fine. She says."
