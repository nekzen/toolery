# Over the downs with Gethin Moss and his dog. Mist, a lost flock, a night in
# a shepherd's hut. Nobody learns the name.
turns:
  - user: |
      At first light I'm at the market cross with my pack and the brass case. "Morning, Gethin. Morning, Sully. Which way?"
    narrator: |
      Gethin Moss is sitting on the step of the cross with a crook across his knees and a pack twice the size of yours, eating the last of a loaf. Sully is already on his feet, tail going. "You came," Gethin says, as if he had laid a small bet with himself and won it. "North, past the forge, then up. Ketta sends her respects and says I'm to carry your case if you'll let me, which you won't, she says."

      The drovers' road leaves the village between two flint walls and climbs at once onto the open down. It is not so much a road as a wide green track worn by a thousand years of hooves, running along the spine of the hills between low banks, with the country falling away on either side into hazy valleys. Larks go up out of the grass ahead of you, one after another. The air is cold and very clear, and you can see for twenty miles: woods, a spire, a white chalk figure of a horse cut into a far hillside.

      Gethin walks with a long, slow, rolling stride that eats the ground without seeming to. "Two days," he says. "Tonight there's a shepherd's hut at Fernhill Bottom, if the shepherd's not in it. Tomorrow we come down into the Stony by evening." He squints north, where a faint greyness lies along the horizon. "If the weather holds. Which it won't."
  - user: |
      "What do you know about the brook between the two farms? Anything about the way it moves would help me."
    narrator: |
      Gethin is quiet for a hundred yards, which you are learning is how he thinks. "It's a chalk stream, the Stony. Comes out of the hill clear as glass, cold as a well, summer and winter. Then halfway down the valley it meets the clay, and on the clay it wanders. Floods every spring, when the snow comes off the downs. Every flood it cuts the outside of a bend and drops gravel on the inside." He traces a lazy S in the air with the end of his crook. "My grandfather said it used to run right under the Crane house. Now it's a quarter-mile off. Old Crane says the land it left is his. Old Hollis says the brook's the boundary wherever it runs. Neither of them's ever going to give."

      He walks on. "There's one thing nobody's thought of, mind. There's an old mill leat on the Hollis side, dry now, all grown over with willow. My father used to say the brook ran down the leat before it ran where it does now. I don't know if that helps."

      The track dips into a fold of the down where a dew pond lies round and grey as a coin, rimmed with trampled chalk. Sully runs ahead to drink. Beyond the pond, the greyness on the northern horizon has thickened into a wall, and the far chalk horse has gone.
  - user: |
      I look at the grey wall coming. "How long before that reaches us?"
    narrator: |
      "An hour," says Gethin. "Less." He whistles Sully back from the pond and looks along the track ahead, where it runs on along the bare spine of the down with nothing to mark it but the low banks on either side. "We'll keep to the banks. If we lose them, we stop, and we sit, and we wait. People die up here walking in circles in a mist, a mile from a farm."

      It comes faster than an hour. First the far valleys go soft and then go out, one by one, like lamps. Then a cold breath moves across the grass, and the larks stop singing, and the mist arrives all at once: a wet white wall that swallows the track twenty yards ahead, and then ten, and then there is nothing but the grass at your feet, the bank beside you, Gethin's broad back and Sully's grey tail going in and out of sight in front of you. Sound goes strange. Your own footsteps are muffled. Somewhere off to the right, impossibly close or impossibly far, a sheep is bleating over and over.

      Gethin stops. "Hear that?" He listens, head on one side. "That's not one sheep. That's a flock, scattered, and a flock doesn't scatter on its own." Sully is standing rigid beside him, nose to the right, quivering.
  - user: |
      "Someone's lost their flock, or their flock's lost them. Do we go and look, or keep to the bank?"
    narrator: |
      Gethin rubs his jaw. "Rule says keep to the bank." He looks down at Sully, who is whining very softly, every hair along his back up. "Dog says otherwise. And I've never known the dog wrong about sheep." He makes up his mind. "We go, but we go on a line. You stay here by the bank, where I can find you. I'll go out with Sully and call. You call back, every time I call, so I can follow your voice home. If you stop hearing me, you stay put and you shout till you're hoarse."

      He unslings his pack, drops it at your feet, and goes off into the white with Sully at his heel. In three steps he is a shadow. In five he is gone. You hear him whistle, and the dog's feet in the wet grass, and then his voice, deep and long: "Hup-hup-hup-ho-o-o!"

      The mist presses close around you. The bank is a dark lump beside you. The bleating comes and goes. Then Gethin's call again, further off: "Hup-hup-ho-o-o!"
