# The first sounding of the gap, at the dawn low slack, from the Kittiwake.
turns:
  - user: |
      "It can be measured, Tam. Whether it can be sailed is what the measuring will tell us. Be at the quay at four and call me every mark, even the ones your uncle won't like." I climb down into the yard.
    narrator: |
      Tam grins, pulls the hatch shut over your head, and is gone; you hear him running back through the lofts.

      The night is short. Widow Sabel wakes you with a knuckle on the door at half past three, and has bread and a mug of hot milk on the counter when you come down with the line over your shoulder and the lead in its sacking. She has drawn the bolts already. Outside, the quay is black and wet, and the only light is the lantern at the Kittiwake's masthead.

      She is smaller than you expected: thirty feet of tarred cutter with a mast too tall for her and a nine-foot boat towing astern. Penhale is at the tiller. Hob and Tam are standing by the lines. Nobody says good morning. Penhale looks at the sky, a paler black to the east, and at the weed streaming from the quay piles.

      "Ebb's nearly done. Cast off." The cutter slides out from the wall under two long sweeps, quiet as he wanted, and the harbour mouth opens ahead, grey on grey.

      Beyond the pier head the swell takes her. Far out to the left a white light turns steadily: the Point. Ahead and to the right there is a sound like a long sheet of cloth being torn, over and over. Penhale nods toward it.

      "That's her. You'll see her in a quarter hour." He glances at the bundle in your arms. "Arm your lead now, while your hands are warm. And tell me where you want the first cast. It's your survey."
  - user: |
      I press tallow into the foot of the lead. "Start well outside, in water you know, so I can prove the line against a depth you trust. Then straight in along the line of the church tower and the beacon."
    narrator: |
      "Prove the line," Penhale repeats. It is the first thing you have said that he seems to find wholly reasonable. "The Outer Road is nine fathoms at low springs, sand and shell. Every pilot here has had that in his hand since he was Tam's age. Hob, bring her to."

      The sweeps check. Tam takes the lead from you with a look that asks permission and is not really waiting for it. He swings it twice and lets it fly forward of the bow, and the new line runs out through his fingers, hissing. When it goes slack he hauls it up and down once to feel the bottom, and reads the mark at the waterline with his thumb, in the dark.

      "By the deep, nine!" His voice cracks on it and he scowls. He brings the lead aboard and holds its foot to the lantern: grey sand, and a speck of broken shell, bedded in the tallow.

      "Nine and shell," says Penhale. "Your line tells the truth. Write it."

      The light is coming. The tearing sound has a shape now: a long low line of white, perhaps half a mile off, running north and south as far as you can see, and rising and falling like something breathing. Behind it the water of the estuary lies flat and pale. The cutter creeps toward it under her sweeps. Tam casts again without being told.

      "And a half, seven! ... By the mark, seven! ... Six!"

      Penhale has not once looked at the white water. He is looking back over his shoulder, at the town, lining something up. "Tower's coming on the beacon," he says. "A minute more. Are you ready with that book?"
  - user: |
      I brace myself against the mast with the notebook open and the pencil tied to my wrist. "Ready. Call the marks and I'll take the time and the bearing at each one."
    narrator: |
      For some minutes there is nothing in the world but Tam's voice, the knock of the sweeps, and the pencil. The square tower of the church slides behind the iron beacon on Gull Rock until the two stand one above the other like the sights of a gun, and Penhale holds them there with small movements of the tiller.

      "By the mark, five! ... Five! ... And a quarter, four!"

      The bar is close now. To the south the seas heap up and fall over in a long ruled line, just as he described it in the Anchor, and the spray drifts across the deck like cold smoke. Directly ahead, between two shoulders of broken water, there is a lane perhaps a ship's length wide where the swell lifts and passes and does not break. In the growing light it is a different colour from everything around it. Tam's grandfather had it right. It is as dark as a horse's eye.

      "Four! ... Four! ... By the mark, three!"

      Hob has stopped breathing through his nose. Penhale's face is the shut door again.

      "Two fathoms and we come out," he says. "I told you." The cutter moves into the lane. The noise of the surf closes in on both sides and the water under the bow goes smooth and black.

      Tam swings, and lets go. The line runs. It keeps running. He stares at his hands.

      "Uncle Jory," he says, in quite a different voice. "She's still taking it."
  - user: |
      "Let it run, Tam. Give me the mark when she touches, whatever it is." I keep my eyes on the line and my pencil on the page.
    narrator: |
      The rags go out through the boy's fingers one after another: white, red. Then the line stops, and lifts, and he plumbs it up and down twice to be certain, his whole body bent over the bow.

      "By the mark, seven!" It comes out as a shout. "Seven fathom, Uncle Jory! Seven!"

      Nobody answers him. Penhale's three-fingered hand has closed very hard on the tiller. Seven fathoms is forty-two feet of water, in a place where every chart in the Guild hall is blank and every pilot's son is taught there is an inch.

      "Again," says Penhale. "Other side. Hob, a stroke to starboard, no more."

      "And a half, six! ... By the deep, six! ... Seven again!"

      Tam brings the lead in and holds it to the lantern, and the foot of it is clean. There is no sand in the tallow at all, only three or four black flakes like chips of slate, and a scratch across the lead itself, bright and new.

      "Rock," says Hob.

      "Scoured," says Penhale slowly. "The ebb's been coming through here so long it's swept the bottom bare. That's why there's no holding. I told them there was no holding. I never thought to ask why." He looks at the two walls of surf, one on each hand, and then at you, and for the first time there is nothing shut in his face at all.

      "You have perhaps twelve minutes of slack left. After that the flood comes through this lane like a millrace and takes us with it. I can give you a line straight through to the inside, or back and forth across to find the edges. Not both. Choose."
  - user: |
      "Across. A channel is only as good as its edges, and I can run the length of it tomorrow. Take us from wall to wall as many times as the slack allows."
    narrator: |
      "Edges," Penhale says. "Aye. A master doesn't hit the middle of a channel." He puts the tiller over.

      It is the strangest twelve minutes of sailing you are ever likely to see. The cutter goes crabwise from one side of the lane to the other, three strokes of the sweeps at a time, while Tam casts and calls and casts again and the notebook fills. The deep water has a floor as flat as a table, six and seven fathoms from side to side. Then, within two boat's lengths, it climbs.

      "Six! ... Five! ... By the mark, three! ... Two!"

      "Out," says Penhale, and Hob backs her off, and they find the other wall the same way. The southern edge is steep, almost a step. The northern one shelves more gently and is all coarse sand, which comes up yellow in the tallow. Between them you count the cutter's lengths, twice, and both times it comes to a little over two hundred feet.

      On the third crossing the lead line trembles in Tam's hand before it has touched anything. A long smooth wrinkle is travelling down the lane toward you from seaward, hardly a ripple. Penhale sees it and his head comes up like a dog's.

      "That's the flood. That's our twenty minutes." He does not raise his voice. "Lead aboard, Tam. Hob, both sweeps, and pull as if your mother were watching. Surveyor, put that book inside your coat and take hold of something. We go out the way we came in, and we go now."
  - user: |
      I button the notebook inside my coat, take a turn of the mainsheet round my wrist, and keep my eyes on the tower and the beacon. "They're still in line. You're straight."
    narrator: |
      "Keep telling me," Penhale says through his teeth. "I can't look at them and her both."

      The wrinkle becomes a current, and the current becomes a slope. The cutter is being pushed back into the estuary as fast as Hob can pull her out; the two shoulders of surf, which a minute ago stood still, are sliding past the wrong way. Hob's breath comes in sobs. Tam has thrown himself on the loom of the second sweep beside him, his feet off the deck at every stroke.

      The tower drifts off the beacon by the width of a finger. You say so, and the tiller moves, and they close again. Twice more it happens. Each time the surf on that side seems to lean toward the boat.

      Then the bow lifts to a proper swell, a long green one with weight in it, and the noise falls away astern. The lead-coloured water of the Outer Road opens round you. Hob lets go of his sweep and lies down on the deck exactly where he is.

      Penhale brings her head to wind and lets her lie. For a while he only looks back at the bar. The sun is coming up behind the town, and with the tide making, the dark lane is already harder to see; in half an hour there will be nothing there but grey water.

      "Twenty-two years," he says. "I've sailed past that twice a day." He turns to you. His voice is rough. "Well. Read it to me. All of it, in order. I want to hear what we did."
  - user: |
      I open the notebook and read the casts back in order: the nine in the Outer Road, the run in, the sevens, the three crossings with the edges at two fathoms, and the width I counted. "Thirty-one casts. One tide. It needs checking at high water and along its length before anyone prints it."
    narrator: |
      Penhale listens to the whole list with his eyes shut. Tam's lips move along with you; he is checking the figures against his own memory and finding them right. When you reach the end there is a silence, with the cutter rocking gently and the gulls beginning.

      "Thirty-one casts and no lies in them," Penhale says. "I've known Guild pilots forty years at sea who couldn't bring me that." He opens his eyes. "You want it at high water, and along the length. That's this evening's slack for the one and tomorrow's dawn for the other. Then the springs, when the stream runs hardest, and we see whether she holds her shape."

      Hob has sat up. He is rubbing his forearms and looking at the notebook in your hands with something close to awe.

      "Seven fathom," he says. "A ship of three hundred tons draws fifteen foot. You could bring the whole fishing fleet through there abreast."

      "You could not, and you'll say nothing of the kind ashore." Penhale rounds on him, though without much force. "Not seven, not a channel, not a word. If the Anchor hears there's a way through before the surveyor has laid it down properly, some fool will try it on the ebb by Friday and we'll be fishing him out." He looks at each of them in turn, the boy last. "We went out to prove a new line in the Outer Road. Nine fathoms, sand and shell. That's all we did."

      He lays the tiller over for the harbour, and adds to you, lower, "Dallow must be told at once, and nobody else. Will you go to him yourself, or shall I?"
  - user: |
      "Together. He'll want to hear it from the skipper who swore it couldn't be done." I wrap the lead back in its sacking. "And I want this line locked up between tides. Where is it safest?"
    narrator: |
      A sound comes out of Penhale that it takes you a moment to recognise as a laugh.

      "Together, then. He'll enjoy that. I've been telling him he was a dreamer since before Tam was born." He steers for the pier head. "As to the line. Aboard, there's the cuddy forward, which has a hasp and a padlock, and I hold the key. Ashore there's Sabel's, with a bolt, and the Guild strongroom, with two locks. A sounding line's no use to a thief. But a line that's a hand short in the fathom is a great deal of use to a man who wants your depths to look wrong."

      He lets that sit. The cutter slips in past the pier, where the first fishing boats are putting out, and their crews look across curiously at the Kittiwake coming home at sunrise with her sweeps still wet.

      "I'd take it ashore with you," he goes on. "Every time. And I'd measure it against Sabel's studs before each tide, in front of a witness, and have the witness sign your book. Then when Dunmore's people stand up and say the surveyor's line was stretched, you'll have a page to show them." He glances at you sideways. "That's how he'll come at it. He won't say there's no channel. He'll say it can't be trusted."

      The quay is close. Nell Harrow is standing on it in her shawl, hugging her elbows, and when she sees the four of you she starts to run along the wall toward the steps. Tam is already waving both arms at her, grinning like a lantern, having evidently forgotten everything his uncle said two minutes ago.
