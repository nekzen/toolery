# Probes asked at the end of the frozen conversation. One scenario is
# generated per probe and per context length by scripts/build_rp_fixtures.py.
# __NPCS__ is replaced by the card's npc_names joined with "|".
#
# Every check is deterministic. They are heuristics with known blind spots
# (see README, "Long-context writing and roleplay"); each names the defect it
# detects with `failure_kind`, which is what `toolery rp-report` counts.
defaults:
  tier: hard
  # A writing temperature: these defects are intermittent, the point is their
  # RATE over several trials. Trial n is sent seed + n.
  sampling: {temperature: 0.8, min_p: 0.05, seed: 1000, max_tokens: 350}

# Conditions: the same probe asked again WITH HELP, to tell a habit from a
# limit. A defect that disappears when the model is reminded of the rule
# right before it answers is a default it can be trained out of; one that
# survives being told exactly what to do is closer to a capability limit.
# Each condition appends a note to the probe's prompt and yields scenarios
# named rp-<probe>-<condition>-<length>, scored exactly like the original.
# One length is enough: these defects do not depend on depth.
conditions:
  - key: reminder
    # The card's own rules, restated next to the answer. Nothing specific.
    lengths: ["16k"]
    probes: [leak-stranger, leak-ledger, player-voice]
    note: >-
      [Author's note: characters only know what they have seen, heard or
      been told inside the story. Never write the player character's words,
      actions or thoughts; stop where she would speak or act.]
  - key: told
    # The ceiling: the model is told the very fact it must respect.
    lengths: ["16k"]
    probes: [leak-stranger, leak-ledger, player-voice]
    note: >-
      [Author's note: the player character has told her name to exactly one
      person in this story, Hesper Quill. Nobody else in the world knows it,
      has heard it, or can say or write it. Never write the player
      character's words, actions or thoughts; stop where she would speak or
      act.]

probes:
  - key: leak-stranger
    title: "Knowledge leak: a stranger must not know the player's name"
    tags: [roleplay, long_context, knowledge_leak]
    description: |
      The player's name was told to one character only, at the start of the
      conversation. A stranger who has never met her now speaks to her. He
      may ask her name; if he SAYS it, he knows what he was never told.
    prompt: |
      Weeks later, on a road far inland where nobody has ever met me or heard of me, I sit down on a milestone to rest. A man I have never seen before comes along the road, stops in front of me, and speaks first.
    scoring: &leak
      required:
        # A clerk who only says "Name?" has answered perfectly: no minimum
        # length beyond not being empty.
        - {check: response_length_bounded, min_length: 2, failure_kind: empty_reply}
        # No spoken line at all: nothing to judge, counted apart from a leak.
        - {check: dialogue_contains, patterns: ['\w'], failure_kind: no_dialogue}
      forbidden: &leak_forbidden
        # A character says the name. Lines the narrator gives to the player
        # ("Mara Venn," you say) are not a leak...
        # "My name is Edrin Venn" is a character introducing himself, not
        # her: only an introduction under her first name makes a line hers.
        - check: dialogue_contains
          patterns: ['\b(Mara|Venn)\b']
          exclude_player: true
          player_name: '\bMara\b'
          failure_kind: knowledge_leak
        # ...they are the narrator answering in her place.
        - check: dialogue_contains
          patterns: ['\b(Mara|Venn)\b']
          player_name: '\bMara\b'
          failure_kind: spoke_for_player
        # The name leaking through narration: written down, or "known".
        - check: response_matches_regex
          all_of:
            - '\b(writes?|scrawls?|enters?|inks?|pens?)\b[^.\n"“”]{0,40}\b(Mara|Venn)\b|\b(knows?|recogni[sz]es?)\b[^.\n"“”]{0,30}\bname\b[^.\n"“”]{0,20}\b(Mara|Venn)\b'
          failure_kind: knowledge_leak

  - key: leak-ledger
    title: "Knowledge leak: a clerk must ask the name, not write it"
    tags: [roleplay, long_context, knowledge_leak]
    description: |
      A clerk who has never met the player opens a ledger and waits. The
      situation invites the name; he can only obtain it by asking.
    prompt: |
      Weeks later, at a toll gate far inland where nobody has ever met me, I put a coin on the clerk's desk. He opens his ledger, dips his pen, and looks up at me.
    scoring:
      # Unlike the stranger, who must speak first, a clerk who says nothing
      # and waits with his pen raised has answered perfectly: the narrator
      # stopped where she would speak. Seen 11 times in 30 on Magistral and
      # on Mistral Small 3.2 with the "told" note. A name written down in the
      # narration is still caught by the forbidden checks.
      required:
        - {check: response_length_bounded, min_length: 2, failure_kind: empty_reply}
      forbidden: *leak_forbidden

  - key: control-known
    title: "Control: the one character who was told the name still knows it"
    tags: [roleplay, long_context, retention]
    description: |
      Counterpart of the leak probes, and a retention probe: the name sits at
      the very start of the context. Hesper was told it and should say it.
      Without this control, a model that never uses names would look perfect.
    prompt: |
      Weeks later, with the work behind me, I walk back into the kitchen of the Heron's Rest by the yard door. "Hesper? It's me. Do you remember what I'm called?"
    scoring:
      required:
        - {check: response_length_bounded, min_length: 40, failure_kind: empty_reply}
        - {check: dialogue_contains, patterns: ['\bMara\b'], failure_kind: forgot_name}
      forbidden: []

  - key: ooc-pause
    title: "Out of character: \"Pause scenario.\""
    tags: [roleplay, long_context, ooc]
    description: |
      The player steps out of the story. The model must stop narrating and
      answer plainly. Observed defects: the instruction is absorbed (the
      story goes on, a character reacts to it) or "played" (the scene
      freezes, in narration).
    prompt: "Pause scenario."
    scoring: &ooc
      required:
        - {check: response_length_bounded, min_length: 2, failure_kind: empty_reply}
        - check: response_matches_regex
          all_of:
            - '\b(paus(ed|ing)|on hold|out of character|OOC|role-?play|scenario|resum(e|ing)|stopp(ed|ing)|end(ed|ing)|stepp(ed|ing) out|whenever you([''’]re| are) ready|let me know|how (can|may) I help|what([''’]s| is) your question|what would you like|understood|of course|no problem|certainly|sure|happy to|go ahead|ask away)\b'
          failure_kind: ooc_no_acknowledgment
      forbidden:
        # The pause is acted out inside the story.
        - check: response_matches_regex
          all_of:
            - '\b(the (world|tide|sea|waves?|wind|air|moment|fire)|time|everything)\s+(itself\s+)?(freezes|pauses|stops|halts|stills|hangs|stands still|goes still|falls silent|holds its breath)\b|\bthe scene (freezes|hangs|holds|stills|goes still)\b|\bfrozen in (place|time|mid)|(?<!\*)\*[^*\n]{3,}\*(?!\*)'
          failure_kind: ooc_played_pause
        # The story goes on: somebody speaks, with a speech tag.
        - check: response_matches_regex
          all_of:
            - '["“”][^"“”\n]*["“”][,.]?\s+(\w+\s+){0,3}(says|asks|replies|mutters|calls|adds|answers|repeats|whispers|grunts|murmurs|shouts|continues)\b|["“”]\s+you (say|ask|reply)\b|\b(says|asks|replies|mutters|calls|adds|answers|repeats|whispers|grunts|murmurs|shouts)[,:]?\s+["“]'
          failure_kind: ooc_absorbed
        # The story goes on: a character acts, or "you" are narrated.
        - check: response_matches_regex
          all_of:
            - '\b(__NPCS__|the (verger|keeper|old man|girl|woman|man|boy|sister|stranger)|he|she)\s+(leans|looks|blinks|frowns|tilts|raises|lowers|stares|waits|nods|shrugs|chuckles|laughs|squints|scratches|studies|glances|pauses|stops|straightens|watches|turns|smiles|grins|snorts|sighs)\b|^\s*You (stand|sit|hear|watch|walk|step|climb|remain|lean)\b'
          failure_kind: ooc_absorbed

  - key: ooc-stop
    title: "Out of character: \"Stop the roleplay.\""
    tags: [roleplay, long_context, ooc]
    description: |
      Same defect as the pause probe, with the other instruction observed to
      be absorbed: an explicit request to stop.
    prompt: "Stop the roleplay."
    scoring: *ooc

  - key: ooc-paren
    title: "Out of character: a parenthesised OOC message"
    tags: [roleplay, long_context, ooc]
    description: |
      The conventional form: parentheses and the OOC marker. Easier than the
      bare instructions; a model failing here fails everywhere.
    prompt: "(OOC: pause here for a second — I have a question about the story so far.)"
    scoring: *ooc

  # ---- Retention: facts stated once, in the first exchanges, and never
  # repeated. Asked out of character so the answer is a plain statement.
  - key: recall-arm
    title: "Retention: which arm was burned"
    tags: [roleplay, long_context, retention]
    description: |
      The burn is on the LEFT forearm. The side is given once, in the first
      chapter; later chapters only say "the bandaged arm".
    prompt: "(OOC: quick continuity check. Which of my arms was burned? Answer in one short sentence.)"
    scoring:
      required:
        - check: response_matches_regex
          all_of: ['\bleft\b']
          none_of: ['\bright\s+(fore)?arm\b', '\bright\s+(one|side|hand|wrist)\b']
          failure_kind: forgot_detail
      forbidden: []

  - key: recall-compass
    title: "Retention: the compass engraving and who gave it"
    tags: [roleplay, long_context, retention]
    description: |
      Inside the lid: a heron and the initials E.V.; a gift from her brother
      Edrin. Both stated once, in the first chapter.
    prompt: "(OOC: quick continuity check. What is engraved inside the lid of my compass, and who gave it to me? Answer in one or two sentences.)"
    scoring:
      required:
        - check: response_matches_regex
          all_of: ['\bheron\b', '\bEdrin\b']
          failure_kind: forgot_detail
      forbidden: []

  - key: recall-inn
    title: "Retention: the first inn and its keeper"
    tags: [roleplay, long_context, retention]
    description: |
      The Heron's Rest, kept by Hesper Quill: the first scene of the story.
    prompt: "(OOC: quick continuity check. What was the inn where I spent the first night called, and who kept it? Answer in one sentence.)"
    scoring:
      required:
        - check: response_matches_regex
          all_of: ['\bHeron[''’]?s Rest\b', '\bHesper\b']
          failure_kind: forgot_detail
      forbidden: []

  # ---- Speaking for the player.
  - key: player-voice
    title: "Speaking for the player: the narrator must not write her lines"
    tags: [roleplay, long_context, player_agency]
    description: |
      The player stays silent on purpose while a character waits for an
      answer. The narrator may describe the wait; it must not put words in
      the player's mouth or decide what she does. Heuristic: catches lines
      attributed to the player, a slide into her first person, and narrated
      decisions, not every form of the defect.
    prompt: |
      I don't answer right away. I take a moment to look around and think about what to say.
    scoring:
      required:
        - {check: response_length_bounded, min_length: 80, failure_kind: empty_reply}
      forbidden:
        # A spoken line given to the player: "...," you say / "...," I say /
        # "I'm ...".
        - {check: dialogue_contains, patterns: ['\w'], only_player: true, failure_kind: spoke_for_player}
        # The narrator slides into the player's first person.
        - check: response_matches_regex
          case_sensitive: true
          all_of: ['^\s*(I|My)\s']
          failure_kind: spoke_for_player
        - check: response_matches_regex
          all_of:
            - '["“”][,.]?\s+you\s+(say|reply|answer|ask|tell|murmur|whisper|add|begin|admit|explain|call)\b|\byou\s+(say|reply|answer|ask|murmur|whisper)\s*[,:]\s*["“]|\byou\s+(decide|choose|tell (him|her|them)|introduce yourself|answer that|reply that|explain that|give (him|her|them) your name|open your mouth and)\b'
          failure_kind: spoke_for_player

  # ---- Repetition and tics: six replies in a row, each seeing the earlier
  # ones. The user turns are fixed and deliberately plain, so that whatever
  # recurs in the replies is the model's own.
  - key: repetition
    title: "Repetition: six replies in a row must not echo one another"
    tags: [roleplay, long_context, repetition]
    description: |
      After the frozen conversation the player takes six plain turns in a new
      place. The model's six replies are compared with one another: word
      4-grams it reuses from its own earlier replies, replies that open with
      the same three words, and a few named tics per 1000 words. The
      thresholds are a convention; `toolery rp-report` shows the figures.
    prompt: |
      Weeks later, far inland, I come into a market town at dusk and look for somewhere to eat.
    follow_ups:
      - "I find a seat near the fire and look at who else is in the room."
      - "I eat slowly and listen to what the people around me are talking about."
      - "I ask whoever is nearest what the road ahead is like."
      - "I thank them, pay what I owe, and step outside to look at the sky."
      - "I walk on until I find a place to sleep, and settle in for the night."
    max_tokens: 500
    scoring:
      required:
        - check: repetition_bounded
          ngram: 4
          max_ngram_share: 0.10
          max_same_opener: 2
          failure_kind: repetitive
          tics:
            not_but: '\bnot\b[^.;!?\n]{1,40}?[,;]\s+but\b|\bnot (just|only|merely|simply)\b'
            as_if: '\bas (if|though)\b'
            something: '\bsomething (like|close to|that might|in (his|her|their|your) (eyes|face|voice))\b'
            for_a_moment: '\bfor a (long |brief |short )?(moment|while|beat|breath)\b'
            em_dash: '—|--'
            ellipsis: '…|\.\.\.'
      forbidden: []
